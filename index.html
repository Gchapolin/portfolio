  <!-- Open Graph / LinkedIn / WhatsApp -->

  <meta property="og:description" content="Mais de 5 anos em produto digital e base em operação. 11 projetos próprios construídos de ponta a ponta com IA — apps nativos, agentes e sistemas gamificados.">

  <meta name="twitter:description" content="Mais de 5 anos em produto digital e base em operação. 11 projetos próprios construídos de ponta a ponta com IA.">
  <meta name="twitter:image" content="https://gchapolin.github.io/portfolio/assets/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <script>
    // define o tema antes da primeira pintura pra nao piscar branco
    (function () {
      var mode = 'light';
      try {
        var saved = localStorage.getItem('gf-theme');
        mode = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', mode);
    })();
  </script>

  <style>
    /* ============================================================
       DIGITAL RESUME — clean/minimal, duotone headings, grid bg
       ============================================================ */
    :root {
      --ink: #111418;
      --ink-soft: #3d434d;
      --gray: #5b616e;
      --gray-light: #868d9c;
      --muted-strong: #6b727f;
      --border: #e8eaee;
      --chip-bg: #f4f5f7;
      --bg: #ffffff;
      --bg-alt: #fafbfc;
      --pill-dark: #16181d;
      --ok: #2f9e63;
      --warn: #d99a2b;
      --muted-dot: #9aa0ab;
      --surface: #ffffff;
      --border-strong: #d5d8de;
      --glass: rgba(255, 255, 255, 0.92);
      --glass-soft: rgba(255, 255, 255, 0.90);
      --glass-strong: rgba(255, 255, 255, 0.99);
      --on-pill: #ffffff;
      --pill-dark-hover: #2a2e36;
      --grid-size: 24px;
      --grid-line: rgba(31, 51, 92, 0.045);
      --section-wash: rgba(31, 51, 92, 0.022);
      --thumb-from: #f4f5f7;
      --thumb-to: #e8eaee;
      --thumb-letter: rgba(17, 20, 24, 0.07);
      --overlay: rgba(17, 20, 24, 0.45);
      --shadow-nav: 0 2px 12px rgba(17, 20, 24, 0.05);
      --shadow-card: 0 14px 40px rgba(17, 20, 24, 0.08);
      --shadow-pop: 0 16px 40px rgba(17, 20, 24, 0.12);
      --shadow-tag: 0 6px 20px rgba(17, 20, 24, 0.18);
      --radius: 14px;
      --radius-lg: 20px;
      --maxw: 1140px;
      --font: 'Manrope', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    :root[data-theme="dark"] {
      --ink: #eef1f5;
      --ink-soft: #c2c8d1;
      --gray: #8f96a2;
      --gray-light: #6b7382;
      --muted-strong: #7d8694;
      --border: #272b33;
      --border-strong: #3a3f49;
      --chip-bg: #1c2027;
      --bg: #0e1013;
      --bg-alt: #121418;
      --surface: #16191e;
      --pill-dark: #eef1f5;
      --pill-dark-hover: #ffffff;
      --on-pill: #0e1013;
      --glass: rgba(22, 25, 30, 0.92);
      --glass-soft: rgba(22, 25, 30, 0.90);
      --glass-strong: rgba(22, 25, 30, 0.99);
      --grid-line: rgba(255, 255, 255, 0.032);
      --section-wash: rgba(255, 255, 255, 0.022);
      --thumb-from: #1c2027;
      --thumb-to: #15181d;
      --thumb-letter: rgba(255, 255, 255, 0.06);
      --muted-dot: #6b727e;
      --ok: #47b97e;
      --warn: #e2ab4c;
      --overlay: rgba(0, 0, 0, 0.66);
      --shadow-nav: 0 2px 12px rgba(0, 0, 0, 0.5);
      --shadow-card: 0 14px 40px rgba(0, 0, 0, 0.45);
      --shadow-pop: 0 16px 40px rgba(0, 0, 0, 0.55);
      --shadow-tag: 0 6px 20px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    section[id] { scroll-margin-top: 96px; }

    body {
      font-family: var(--font);
      transition: background-color 0.3s ease, color 0.3s ease;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }

    a, button { transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      html { scroll-behavior: auto; }
    }

    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

    /* ---------- Entrada ao rolar ---------- */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s cubic-bezier(0.22, 0.61, 0.36, 1),
                  transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
      transition-delay: var(--reveal-delay, 0ms);
    }
    .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; }
    }

    /* ---------- Duotone headings ---------- */
    .h2 {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .h2 .a { color: var(--ink); }
    .h2 .b { color: var(--gray-light); }
    .section-sub {
      color: var(--gray);
      font-size: 15px;
      margin-top: 12px;
      max-width: 300px;
    }

    /* ---------- Floating pill nav ---------- */
    .nav {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 50;
      pointer-events: none;
    }
    .nav__inner {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .nav__inner > * { pointer-events: auto; }
    .nav__logo {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
      background: var(--glass-soft);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 10px 18px;
    }
    .nav__logo span { color: var(--muted-strong); }
    .nav__links {
      display: flex;
      gap: 4px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px;
      box-shadow: var(--shadow-nav);
    }
    .nav__links a {
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 999px;
    }
    .nav__links a:hover { color: var(--ink); }
    .nav__links a.active { background: var(--chip-bg); color: var(--ink); }
    .nav__panel a.active { background: var(--chip-bg); }
    .nav__actions { display: flex; align-items: center; gap: 8px; }

    .theme-toggle {
      width: 42px;
      height: 42px;
      flex: none;
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--ink-soft);
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow-nav);
      cursor: pointer;
    }
    .theme-toggle:hover { color: var(--ink); border-color: var(--border-strong); }
    .theme-toggle svg { width: 17px; height: 17px; }
    .theme-toggle__sun { display: none; }
    :root[data-theme="dark"] .theme-toggle__sun { display: block; }
    :root[data-theme="dark"] .theme-toggle__moon { display: none; }

    .nav__panel-foot {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 10px 8px 2px;
      border-top: 1px solid var(--border);
    }
    .nav__panel-foot .theme-toggle { box-shadow: none; }

    /* Burger + painel mobile */
    .nav__burger {
      display: none;
      width: 42px;
      height: 42px;
      flex: none;
      place-items: center;
      align-content: center;
      padding: 0;
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow-nav);
      cursor: pointer;
    }
    .nav__burger span {
      display: block;
      width: 16px;
      height: 2px;
      border-radius: 2px;
      background: var(--ink);
      transition: transform 0.25s ease, opacity 0.18s ease;
    }
    .nav__burger span + span { margin-top: 4px; }
    .nav__burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav__burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .nav__burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .nav__panel {
      display: none;
      flex-direction: column;
      pointer-events: auto;
      width: calc(100% - 48px);
      max-width: 320px;
      margin: 10px 24px 0 auto;
      padding: 8px;
      background: var(--glass-strong);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-pop);
    }
    .nav__panel.open { display: flex; animation: panelIn 0.22s ease; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: none; }
    }
    .nav__panel a {
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 12px;
    }
    .nav__panel a:hover, .nav__panel a:focus-visible { background: var(--chip-bg); }
    .nav__panel-cv {
      margin-top: 6px;
      text-align: center;
      background: var(--pill-dark);
      color: var(--on-pill) !important;
      border-radius: 999px !important;
    }
    .nav__panel-cv:hover { background: var(--pill-dark-hover) !important; }
    /* acima de 560px o pill "Curriculo" ja aparece na nav, entao some do painel */
    @media (min-width: 561px) { .nav__panel-cv { display: none; } }
    .lang-toggle {
      display: flex;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
    }
    .lang-toggle button {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 700;
      color: var(--gray);
      background: transparent;
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .lang-toggle button.active { background: var(--ink); color: var(--on-pill); }
    .btn-dark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--pill-dark);
      color: var(--on-pill);
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-dark:hover { background: var(--pill-dark-hover); }
    .btn-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 22px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-line:hover { border-color: var(--ink); }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      padding: 150px 24px 110px;
      text-align: center;
      overflow: hidden;
    }
    .hero > * { position: relative; }
    .hero__stage {
      position: relative;
      width: min(720px, 100%);
      margin: 0 auto 32px;
    }
    .hero__stage picture { display: block; }
    .hero__art {
      width: 100%;
      height: auto;
      border-radius: var(--radius-lg);
      /* o papel creme do desenho some no multiply e o quadriculado
         atravessa, como se tivesse sido desenhado na propria pagina */
      mix-blend-mode: multiply;
    }
    :root[data-theme="dark"] .hero__art {
      /* no escuro nao da pra inverter: a ilustracao tem rostos e o negativo
         deforma as feicoes. Fica como uma estampa clara apoiada na pagina,
         so um pouco abaixada pra nao estourar contra o fundo */
      mix-blend-mode: normal;
      filter: brightness(0.88) contrast(1.02);
      box-shadow: var(--shadow-card);
    }
    .cursor-tag {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--pill-dark);
      color: var(--on-pill);
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      padding: 7px 14px;
      white-space: nowrap;
      box-shadow: var(--shadow-tag);
    }
    .cursor-tag svg { width: 12px; height: 12px; flex: none; }
    .cursor-tag--l { left: -18px; bottom: 6%; transform: rotate(-5deg); }
    .cursor-tag--r { right: -18px; top: 6%; transform: rotate(4deg); }
    .hero__chips {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .chip {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--gray);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
    }
    .hero__title {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }
    .hero__title .muted { color: var(--gray-light); }
    .hero__sub {
      max-width: 620px;
      margin: 0 auto 32px;
      color: var(--gray);
      font-size: 17px;
      line-height: 1.6;
    }
    .hero__ctas { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

    /* ---------- Section layout: heading left, content right ---------- */
    .section { padding: 90px 0; }
    .section--alt { background: var(--section-wash); }
    .split {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 56px;
      align-items: start;
    }
    .split__head { position: sticky; top: 110px; }

    /* ---------- Journey ---------- */
    .journey p { color: var(--ink-soft); font-size: 15.5px; line-height: 1.75; margin-bottom: 18px; }
    .journey p:last-child { margin-bottom: 0; }
    .journey p:first-child { font-size: 17px; color: var(--ink); font-weight: 600; }

    /* ---------- Projects ---------- */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .tabs button {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      color: var(--gray);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 18px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tabs button:hover { border-color: var(--ink); color: var(--ink); }
    .tabs button.active { background: var(--ink); border-color: var(--ink); color: var(--on-pill); }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-card);
      outline: none;
    }
    .card__thumb {
      position: relative;
      /* mesma proporcao das capas geradas (1260x600): assim a capa entra
         inteira em qualquer largura de card, sem corte lateral */
      aspect-ratio: 21 / 10;
      background: linear-gradient(135deg, var(--thumb-from) 0%, var(--thumb-to) 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    /* capa real: screenshot do proprio projeto */
    /* posicionada em vez de item de grid: com place-items:center o
       height:100% resolvia contra o conteudo, nao contra os 168px do thumb,
       e a capa transbordava a moldura */
    .card__shot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* a capa e montada com o conteudo que identifica o projeto no topo;
         ancorar no topo evita que a moldura do card corte justo nele */
      object-position: center top;
      transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .card:hover .card__shot { transform: scale(1.04); }

    /* sem capa: monograma sobre a textura do thumb */
    .card__thumb-letter {
      position: relative;
      transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
      font-size: 84px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--thumb-letter);
      user-select: none;
    }
    .card:hover .card__thumb-letter,
    .card:focus-visible .card__thumb-letter { transform: scale(1.07) translateY(-2px); }
    .card__status {
      position: absolute;
      top: 14px;
      right: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gray);
      padding: 4px 11px;
    }
    .card__status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted-dot);
    }
    .card__status--production::before { background: var(--ok); }
    .card__status--beta::before, .card__status--mvp::before { background: var(--warn); }
    .card__status--launch::before { background: var(--ok); }
    .card__body { padding: 22px 24px 24px; }
    .card__name { font-size: 19px; font-weight: 800; letter-spacing: -0.015em; margin-bottom: 6px; }
    .card__tagline { color: var(--gray); font-size: 14px; line-height: 1.55; margin-bottom: 14px; }
    .card__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .card__meta span {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--gray);
      background: var(--chip-bg);
      border-radius: 999px;
      padding: 4px 11px;
    }
    .card__link {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
    }
    .card__link::after {
      content: "\2192";
      display: inline-block;
      margin-left: 6px;
      transition: transform 0.25s ease;
    }
    .card:hover .card__link::after,
    .card:focus-visible .card__link::after { transform: translateX(4px); }

    /* ---------- Work history / education cards ---------- */
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .xp {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 26px;
    }
    .xp__head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .xp__logo {
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--chip-bg);
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }
    .xp__name { font-size: 16.5px; font-weight: 800; letter-spacing: -0.01em; }
    .xp__role { font-size: 14px; color: var(--gray); font-weight: 600; }
    .xp__period { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
    .xp__desc { font-size: 14px; color: var(--gray); line-height: 1.65; margin-bottom: 14px; }
    .xp__chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .xp__chips span {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--gray);
      background: var(--chip-bg);
      border-radius: 999px;
      padding: 4px 11px;
    }
    .xp__chips span.now { background: var(--ink); color: var(--on-pill); }

    /* ---------- Linha do tempo (experiencia) ---------- */
    .timeline { position: relative; }
    .tl { position: relative; padding-left: 64px; padding-bottom: 18px; }
    .tl:last-child { padding-bottom: 0; }
    .tl::before {
      content: "";
      position: absolute;
      left: 21px;
      top: 10px;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }
    .tl:last-child::before { display: none; }
    .tl__dot {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--chip-bg);
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
    }
    .tl--current .tl__dot {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--on-pill);
    }
    .tl__card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px 22px;
    }
    .tl__period {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 8px;
    }
    .tl__name { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
    .tl__role { font-size: 14px; font-weight: 600; color: var(--gray); margin-bottom: 12px; }
    .tl__desc { font-size: 14px; line-height: 1.7; color: var(--ink-soft); margin-bottom: 14px; }
    .tl__chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .tl__chips span {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--gray);
      background: var(--chip-bg);
      border-radius: 999px;
      padding: 4px 11px;
    }
    .tl__chips span.now { background: var(--ink); color: var(--on-pill); }

    /* ---------- Skills ---------- */
    .skill-group { margin-bottom: 22px; }
    .skill-group:last-child { margin-bottom: 0; }
    .skill-group__label { font-size: 13px; font-weight: 800; letter-spacing: 0.02em; margin-bottom: 10px; }
    .skill-group__box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .skill-group__box span {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-soft);
      background: var(--chip-bg);
      border-radius: 999px;
      padding: 6px 13px;
      cursor: default;
    }

    /* ---------- Toolbox ---------- */
    .toolbox { text-align: center; }
    .toolbox .h2 { margin-bottom: 12px; }
    .toolbox__sub { color: var(--gray); font-size: 15px; max-width: 460px; margin: 0 auto 40px; }
    .toolbox__grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-width: 760px;
      margin: 0 auto;
    }
    .tool {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-soft);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .tool:hover { transform: translateY(-2px); border-color: var(--ink); }

    /* ---------- Connect / footer ---------- */
    .connect {
      text-align: center;
      padding: 100px 24px 0;
    }
    .connect__logo { font-weight: 800; font-size: 15px; margin-bottom: 18px; }
    .connect__logo span { color: var(--muted-strong); }
    .connect .h2 { margin-bottom: 16px; }
    .connect__sub { color: var(--gray); font-size: 15px; max-width: 480px; margin: 0 auto 28px; }
    .footer {
      max-width: var(--maxw);
      margin: 72px auto 0;
      padding: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .footer__legal { color: var(--gray); font-size: 13px; }
    .footer__social { display: flex; gap: 8px; }
    .footer__social a {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--gray);
    }
    .footer__social a:hover { color: var(--ink); border-color: var(--ink); }
    .footer__social svg { width: 16px; height: 16px; }

    /* ---------- Modal ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
      overflow-y: auto;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      max-width: 760px;
      width: 100%;
      padding: 40px;
    }
    .modal__close {
      background: transparent;
      border: none;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      color: var(--gray);
      cursor: pointer;
      margin-bottom: 24px;
      padding: 0;
    }
    .modal__close:hover { color: var(--ink); }
    .modal__header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .modal__name { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    .modal__badge {

      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gray);
      padding: 4px 11px;

    .modal__tagline { color: var(--gray); font-size: 15px; margin-bottom: 24px; line-height: 1.55; }
    .modal__section-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-light);
      margin: 24px 0 12px;
    }
    .modal__desc { font-size: 14.5px; line-height: 1.7; color: var(--ink-soft); }
    .modal__tech { display: flex; flex-wrap: wrap; gap: 8px; }
    .modal__tech span {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-soft);
      background: var(--chip-bg);
      border-radius: 999px;
      padding: 5px 13px;
    }
    .modal__features { list-style: none; }
    .modal__features li {
      padding: 9px 0 9px 22px;
      position: relative;
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink-soft);
      border-top: 1px solid var(--bg-alt);
    }
    .modal__features li:first-child { border-top: none; }
    .modal__features li::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 16px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
    }
    .modal__highlight {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--ink-soft);
    }
    /* grade que quebra linha, nao fita horizontal: a fita cortava a ultima
       tela no meio na borda do modal e parecia defeito, nao scroll */
    .modal__shots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 22px 16px;
    }
    /* telas de dashboard sao deitadas e precisam de coluna mais larga */
    .modal__shots--wide { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .modal__shots figure { margin: 0; min-width: 0; }
    .modal__shots img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--thumb-from);
    }
    .modal__shots figcaption { font-size: 11px; color: var(--gray); margin-top: 8px; line-height: 1.4; }
    .modal__sub { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 8px; }
    .modal__sub-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 4px; }
    .modal__sub-head strong { font-weight: 800; }
    .modal__sub-head span { color: var(--gray); font-size: 12px; }
    .modal__sub p { font-size: 13.5px; color: var(--gray); line-height: 1.55; }
    .modal__links { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
    .modal__private { color: var(--gray); font-size: 13px; align-self: center; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1080px) {
      .cursor-tag--l { left: -8px; }
      .cursor-tag--r { right: -8px; }
    }
    @media (max-width: 900px) {
      .nav__links { display: none; }
      .nav__burger { display: grid; }

      .hero__title { font-size: 42px; }
      .h2 { font-size: 32px; }
      .split { grid-template-columns: 1fr; gap: 32px; }
      .split__head { position: static; }
      .section-sub { max-width: none; }
      .cards { grid-template-columns: 1fr; }
      /* no mobile as tags ocupavam quase metade da largura do desenho
         e caiam por cima das figuras */
      .cursor-tag { font-size: 10.5px; padding: 5px 11px; gap: 5px; }
      .cursor-tag svg { width: 10px; height: 10px; }
      .cursor-tag--l { left: -4px; bottom: -10px; }
      .cursor-tag--r { right: -4px; top: -10px; }
    }
    @media (max-width: 560px) {

      .nav__logo { font-size: 15px; padding: 9px 14px; white-space: nowrap; }

    var REVEAL_GROUPS = ['#projects-grid', '#work-list', '#edu-list', '#skills-list', '#toolbox-grid'];

    function observeReveals() {
      if (!revealObserver) return;
      REVEAL_GROUPS.forEach(function (sel) {
        var group = document.querySelector(sel);
        if (!group) return;
        Array.prototype.forEach.call(group.children, function (child, i) {
          if (child.classList.contains('reveal')) return;
          child.classList.add('reveal');
          child.style.setProperty('--reveal-delay', Math.min(i, 6) * 60 + 'ms');
        });
      });
      document.querySelectorAll(STATIC_REVEALS).forEach(function (el) {
        if (!el.classList.contains('in')) el.classList.add('reveal');
      });
      document.querySelectorAll('.reveal:not(.in)').forEach(function (el) {
        revealObserver.observe(el);
      });
    }

    // rede de seguranca: num scroll muito rapido o observer pode nao chegar a
    // disparar pra um elemento, entao varremos o que ja entrou na viewport
    function sweepReveals() {
      if (!revealObserver) return;
      var limit = window.innerHeight * 0.92;
      document.querySelectorAll('.reveal:not(.in)').forEach(function (el) {
        if (el.getBoundingClientRect().top < limit) {
          el.classList.add('in');
          revealObserver.unobserve(el);
        }
      });

    // destaca no menu a secao em que o leitor esta
    (function initScrollSpy() {
      var links = Array.prototype.slice.call(
        document.querySelectorAll('.nav__links a[href^="#"], .nav__panel a[href^="#"]')
      );
      if (!links.length) return;

      // so as secoes que existem no menu; as demais (formacao, toolbox)
      // ficam absorvidas pela anterior em vez de apagar o destaque
      var ids = [];
      links.forEach(function (a) {
        var id = a.getAttribute('href').slice(1);
        if (id && ids.indexOf(id) === -1 && document.getElementById(id)) ids.push(id);
      });
      if (!ids.length) return;

      var ticking = false;

      function update() {
        ticking = false;
        sweepReveals();
        var line = window.scrollY + window.innerHeight * 0.35;
        var atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
        var current = '';

        if (atBottom) {
          current = ids[ids.length - 1];
        } else {
          for (var i = 0; i < ids.length; i++) {
            var top = document.getElementById(ids[i]).getBoundingClientRect().top + window.scrollY;
            if (top <= line) current = ids[i];
          }
        }

        links.forEach(function (a) {
          a.classList.toggle('active', a.getAttribute('href') === '#' + current);
        });
      }

      window.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(update);
      }, { passive: true });
      window.addEventListener('resize', update);
      update();
    })();

    // ============================
    // INIT
    // ============================
    function renderAll() {
      renderUiStrings();
      renderJourney();
      renderTabs();
      renderProjects();
      renderWork();
      renderEducation();
      renderSkills();
      renderToolbox();
      observeReveals();
    }
    renderAll();
  })();
  </script>
</body>
</html>

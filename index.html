  <!-- Twitter / X -->

  <meta name="twitter:title" content="Guilherme Ferreira — Product Manager que constrói">
  <meta name="twitter:description" content="Mais de 5 anos em produto digital e base em operação. 10 projetos próprios construídos de ponta a ponta com IA.">
  <meta name="twitter:image" content="https://gchapolin.github.io/portfolio/assets/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <script>
    // define o tema antes da primeira pintura pra nao piscar branco
    (function () {
      var mode = 'light';
      try {
        var saved = localStorage.getItem('gf-theme');
        mode = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', mode);
    })();
  </script>

  <style>
    /* ============================================================
       DIGITAL RESUME — clean/minimal, duotone headings, grid bg
       ============================================================ */
    :root {
      --ink: #111418;
      --ink-soft: #3d434d;
      --gray: #5b616e;
      --gray-light: #b9bec7;
      --border: #e8eaee;
      --chip-bg: #f4f5f7;
      --bg: #ffffff;
      --bg-alt: #fafbfc;
      --pill-dark: #16181d;
      --ok: #2f9e63;
      --warn: #d99a2b;
      --muted-dot: #9aa0ab;
      --surface: #ffffff;
      --border-strong: #d5d8de;
      --glass: rgba(255, 255, 255, 0.92);
      --glass-soft: rgba(255, 255, 255, 0.90);
      --glass-strong: rgba(255, 255, 255, 0.99);
      --on-pill: #ffffff;
      --pill-dark-hover: #2a2e36;
      --grid-size: 24px;
      --grid-line: rgba(31, 51, 92, 0.10);
      --section-wash: rgba(31, 51, 92, 0.022);
      --thumb-from: #f4f5f7;
      --thumb-to: #e8eaee;
      --thumb-letter: rgba(17, 20, 24, 0.07);
      --avatar-from: #f2f3f5;
      --avatar-to: #e2e4e9;
      --avatar-ring: #ffffff;
      --overlay: rgba(17, 20, 24, 0.45);
      --shadow-nav: 0 2px 12px rgba(17, 20, 24, 0.05);
      --shadow-card: 0 14px 40px rgba(17, 20, 24, 0.08);
      --shadow-pop: 0 16px 40px rgba(17, 20, 24, 0.12);
      --shadow-tag: 0 6px 20px rgba(17, 20, 24, 0.18);
      --shadow-avatar: 0 10px 40px rgba(17, 20, 24, 0.12);
      --radius: 14px;
      --radius-lg: 20px;
      --maxw: 1140px;
      --font: 'Manrope', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    :root[data-theme="dark"] {
      --ink: #eef1f5;
      --ink-soft: #c2c8d1;
      --gray: #8f96a2;
      --gray-light: #565d69;
      --border: #272b33;
      --border-strong: #3a3f49;
      --chip-bg: #1c2027;
      --bg: #0e1013;
      --bg-alt: #121418;
      --surface: #16191e;
      --pill-dark: #eef1f5;
      --pill-dark-hover: #ffffff;
      --on-pill: #0e1013;
      --glass: rgba(22, 25, 30, 0.92);
      --glass-soft: rgba(22, 25, 30, 0.90);
      --glass-strong: rgba(22, 25, 30, 0.99);
      --grid-line: rgba(255, 255, 255, 0.07);
      --section-wash: rgba(255, 255, 255, 0.022);
      --thumb-from: #1c2027;
      --thumb-to: #15181d;
      --thumb-letter: rgba(255, 255, 255, 0.06);
      --avatar-from: #22262d;
      --avatar-to: #171a20;
      --avatar-ring: #1c2027;
      --muted-dot: #6b727e;
      --ok: #47b97e;
      --warn: #e2ab4c;
      --overlay: rgba(0, 0, 0, 0.66);
      --shadow-nav: 0 2px 12px rgba(0, 0, 0, 0.5);
      --shadow-card: 0 14px 40px rgba(0, 0, 0, 0.45);
      --shadow-pop: 0 16px 40px rgba(0, 0, 0, 0.55);
      --shadow-tag: 0 6px 20px rgba(0, 0, 0, 0.5);
      --shadow-avatar: 0 10px 40px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    section[id] { scroll-margin-top: 96px; }

    body {
      font-family: var(--font);
      transition: background-color 0.3s ease, color 0.3s ease;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }

    a, button { transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      html { scroll-behavior: auto; }
    }

    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

    /* ---------- Entrada ao rolar ---------- */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s cubic-bezier(0.22, 0.61, 0.36, 1),
                  transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
      transition-delay: var(--reveal-delay, 0ms);
    }
    .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; }
    }

    /* ---------- Duotone headings ---------- */
    .h2 {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .h2 .a { color: var(--ink); }
    .h2 .b { color: var(--gray-light); }
    .section-sub {
      color: var(--gray);
      font-size: 15px;
      margin-top: 12px;
      max-width: 300px;
    }

    /* ---------- Floating pill nav ---------- */
    .nav {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 50;
      pointer-events: none;
    }
    .nav__inner {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .nav__inner > * { pointer-events: auto; }
    .nav__logo {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
      background: var(--glass-soft);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 10px 18px;
    }
    .nav__logo span { color: var(--gray-light); }
    .nav__links {
      display: flex;
      gap: 4px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px;
      box-shadow: var(--shadow-nav);
    }
    .nav__links a {
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 999px;
    }
    .nav__links a:hover { color: var(--ink); }
    .nav__links a.active { background: var(--chip-bg); color: var(--ink); }
    .nav__panel a.active { background: var(--chip-bg); }
    .nav__actions { display: flex; align-items: center; gap: 8px; }

    .theme-toggle {
      width: 42px;
      height: 42px;
      flex: none;
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--ink-soft);
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow-nav);
      cursor: pointer;
    }
    .theme-toggle:hover { color: var(--ink); border-color: var(--border-strong); }
    .theme-toggle svg { width: 17px; height: 17px; }
    .theme-toggle__sun { display: none; }
    :root[data-theme="dark"] .theme-toggle__sun { display: block; }
    :root[data-theme="dark"] .theme-toggle__moon { display: none; }

    .nav__panel-foot {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 10px 8px 2px;
      border-top: 1px solid var(--border);
    }
    .nav__panel-foot .theme-toggle { box-shadow: none; }

    /* Burger + painel mobile */
    .nav__burger {
      display: none;
      width: 42px;
      height: 42px;
      flex: none;
      place-items: center;
      align-content: center;
      padding: 0;
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow-nav);
      cursor: pointer;
    }
    .nav__burger span {
      display: block;
      width: 16px;
      height: 2px;
      border-radius: 2px;
      background: var(--ink);
      transition: transform 0.25s ease, opacity 0.18s ease;
    }
    .nav__burger span + span { margin-top: 4px; }
    .nav__burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav__burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .nav__burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .nav__panel {
      display: none;
      flex-direction: column;
      pointer-events: auto;
      width: calc(100% - 48px);
      max-width: 320px;
      margin: 10px 24px 0 auto;
      padding: 8px;
      background: var(--glass-strong);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-pop);
    }
    .nav__panel.open { display: flex; animation: panelIn 0.22s ease; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: none; }
    }
    .nav__panel a {
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 12px;
    }
    .nav__panel a:hover, .nav__panel a:focus-visible { background: var(--chip-bg); }
    .nav__panel-cv {
      margin-top: 6px;
      text-align: center;
      background: var(--pill-dark);
      color: var(--on-pill) !important;
      border-radius: 999px !important;
    }
    .nav__panel-cv:hover { background: var(--pill-dark-hover) !important; }
    /* acima de 560px o pill "Curriculo" ja aparece na nav, entao some do painel */
    @media (min-width: 561px) { .nav__panel-cv { display: none; } }
    .lang-toggle {
      display: flex;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
    }
    .lang-toggle button {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 700;
      color: var(--gray);
      background: transparent;
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .lang-toggle button.active { background: var(--ink); color: var(--on-pill); }
    .btn-dark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--pill-dark);
      color: var(--on-pill);
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-dark:hover { background: var(--pill-dark-hover); }
    .btn-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 22px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-line:hover { border-color: var(--ink); }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      padding: 150px 24px 110px;
      text-align: center;
      overflow: hidden;
    }
    .hero > * { position: relative; }
    .hero__stage {
      position: relative;
      width: 260px;
      margin: 0 auto 28px;
    }
    .hero__avatar {
      width: 168px;
      height: 168px;
      margin: 0 auto;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--avatar-from), var(--avatar-to));
      border: 6px solid var(--avatar-ring);
      box-shadow: var(--shadow-avatar);
      display: grid;
      place-items: center;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .cursor-tag {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--pill-dark);
      color: var(--on-pill);
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      padding: 7px 14px;
      white-space: nowrap;
      box-shadow: var(--shadow-tag);
    }
    .cursor-tag svg { width: 12px; height: 12px; flex: none; }
    .cursor-tag--l { left: -92px; top: 44%; transform: rotate(-5deg); }
    .cursor-tag--r { right: -86px; top: 14%; transform: rotate(4deg); }
    .hero__chips {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .chip {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--gray);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
    }
    .hero__title {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }
    .hero__title .muted { color: var(--gray-light); }
    .hero__sub {
      max-width: 620px;
      margin: 0 auto 32px;
      color: var(--gray);
      font-size: 17px;
      line-height: 1.6;
    }
    .hero__ctas { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

    /* ---------- Section layout: heading left, content right ---------- */
    .section { padding: 90px 0; }
    .section--alt { background: var(--section-wash); }
    .split {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 56px;
      align-items: start;
    }
    .split__head { position: sticky; top: 110px; }

    /* ---------- Journey ---------- */
    .journey p { color: var(--ink-soft); font-size: 15.5px; line-height: 1.75; margin-bottom: 18px; }
    .journey p:last-child { margin-bottom: 0; }
    .journey p:first-child { font-size: 17px; color: var(--ink); font-weight: 600; }

    /* ---------- Projects ---------- */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .tabs button {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      color: var(--gray);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 18px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tabs button:hover { border-color: var(--ink); color: var(--ink); }
    .tabs button.active { background: var(--ink); border-color: var(--ink); color: var(--on-pill); }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-card);
      outline: none;
    }
    .card__thumb {
      position: relative;
      height: 120px;
      background: linear-gradient(135deg, var(--thumb-from) 0%, var(--thumb-to) 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .card__thumb-letter {
      position: relative;
      transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
      font-size: 84px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--thumb-letter);
      user-select: none;
    }
    .card__status {
      position: absolute;
      top: 14px;
      right: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gray);
      padding: 4px 11px;
    }
    .card__status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted-dot);
    }
    .card__status--production::before { background: var(--ok); }
    .card__status--beta::before, .card__status--mvp::before { background: var(--warn); }
    .card__status--launch::before { background: var(--ok); }
    .card__collab {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--pill-dark);
      color: var(--on-pill);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 5px 12px;
    }
    .card__body { padding: 22px 24px 24px; }
    .card__name { font-size: 19px; font-weight: 800; letter-spacing: -0.015em; margin-bottom: 6px; }
    .card__tagline { color: var(--gray); font-size: 14px; line-height: 1.55; margin-bottom: 14px; }
    .card__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .card__meta span {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--gray);
      background: var(--chip-bg);
      border-radius: 999px;
      padding: 4px 11px;
    }
    .card__link {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
    }
    .card__link::after {
      content: "\2192";
      display: inline-block;
      margin-left: 6px;
      transition: transform 0.25s ease;
    }
    .card:hover .card__link::after,
    .card:focus-visible .card__link::after { transform: translateX(4px); }
    .card:hover .card__thumb-letter,
    .card:focus-visible .card__thumb-letter { transform: scale(1.07) translateY(-2px); }

    /* ---------- Work history / education cards ---------- */
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .xp {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 26px;
    }
    .xp__head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .xp__logo {
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--chip-bg);
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }
    .xp__name { font-size: 16.5px; font-weight: 800; letter-spacing: -0.01em; }
    .xp__role { font-size: 14px; color: var(--gray); font-weight: 600; }
    .xp__period { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
    .xp__desc { font-size: 14px; color: var(--gray); line-height: 1.65; margin-bottom: 14px; }
    .xp__chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .xp__chips span {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--gray);
      background: var(--chip-bg);
      border-radius: 999px;
      padding: 4px 11px;
    }
    .xp__chips span.now { background: var(--ink); color: var(--on-pill); }

    /* ---------- Linha do tempo (experiencia) ---------- */
    .timeline { position: relative; }
    .tl { position: relative; padding-left: 64px; padding-bottom: 18px; }
    .tl:last-child { padding-bottom: 0; }
    .tl::before {
      content: "";

      if (p.live) html += '<a href="' + p.live + '" target="_blank" rel="noopener noreferrer" class="btn-dark">' + ui('modalLive') + '</a>';
      if (p.github) {
        html += '<a href="' + p.github + '" target="_blank" rel="noopener noreferrer" class="btn-line">' + ui('modalGithub') + '</a>';
      } else if (!p.live) {
        html += '<span class="modal__private">' + ui('modalPrivate') + '</span>';
      }
      html += '</div>';

      modalContent.innerHTML = html;
      modalClose.textContent = ui('modalClose');
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      modalClose.focus();
    }

    function closeModal() {
      overlay.classList.remove('open');
      openProjectId = null;
      document.body.style.overflow = '';
      if (lastFocused) lastFocused.focus();
    }

    modalClose.addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
    });

    // ============================
    // EVENTS
    // ============================
    document.getElementById('theme-tabs').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-theme]');
      if (!btn) return;
      activeTheme = btn.getAttribute('data-theme');
      renderTabs();
      renderProjects();
    });

    function cardHandler(e) {
      var card = e.target.closest('.card');
      if (!card) return;
      if (e.type === 'click' || (e.type === 'keydown' && (e.key === 'Enter' || e.key === ' '))) {
        if (e.type === 'keydown') e.preventDefault();
        openModal(card.dataset.project);
      }
    }
    var grid = document.getElementById('projects-grid');
    grid.addEventListener('click', cardHandler);
    grid.addEventListener('keydown', cardHandler);

    // ============================
    // TEMA (claro / escuro)
    // ============================
    var THEME_KEY = 'gf-theme';
    var themeButtons = document.querySelectorAll('.theme-toggle');

    function currentTheme() {
      return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }

    function applyTheme(mode, persist) {
      document.documentElement.setAttribute('data-theme', mode);
      if (persist) {
        try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
      }
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', mode === 'dark' ? '#0e1013' : '#ffffff');
      themeButtons.forEach(function (b) {
        b.setAttribute('aria-pressed', mode === 'dark' ? 'true' : 'false');
      });
    }

    themeButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
      });
    });
    applyTheme(currentTheme(), false);

    // enquanto nao houver escolha explicita, segue a preferencia do sistema
    try {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onSchemeChange = function (e) {
        var saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch (err) {}
        if (!saved) applyTheme(e.matches ? 'dark' : 'light', false);
      };
      if (mq.addEventListener) mq.addEventListener('change', onSchemeChange);
      else if (mq.addListener) mq.addListener(onSchemeChange);
    } catch (e) {}

    // Menu mobile
    var burger = document.getElementById('nav-burger');
    var panel = document.getElementById('nav-panel');

    function setMenu(open) {
      panel.classList.toggle('open', open);
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    burger.addEventListener('click', function () {
      setMenu(burger.getAttribute('aria-expanded') !== 'true');
    });
    panel.addEventListener('click', function (e) {
      if (e.target.closest('a')) setMenu(false);
    });
    document.addEventListener('click', function (e) {
      if (burger.getAttribute('aria-expanded') !== 'true') return;
      if (!e.target.closest('#nav-panel') && !e.target.closest('#nav-burger')) setMenu(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && burger.getAttribute('aria-expanded') === 'true') {
        setMenu(false);
        burger.focus();
      }
    });
    window.addEventListener('resize', function () {
      if (window.innerWidth > 900) setMenu(false);
    });

    document.querySelectorAll('.lang-toggle button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.dataset.lang === currentLang) return;
        currentLang = btn.dataset.lang;
        document.querySelectorAll('.lang-toggle button').forEach(function (b) {
          b.classList.toggle('active', b.dataset.lang === currentLang);
        });
        renderAll();
        if (openProjectId) openModal(openProjectId);
      });
    });

    // ============================
    // ENTRADA AO ROLAR + SCROLLSPY
    // ============================
    var reduceMotion = false;
    try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

    var revealObserver = null;
    if (!reduceMotion && 'IntersectionObserver' in window) {
      revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('in');
          revealObserver.unobserve(entry.target);
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    }

    // blocos estaticos que entram inteiros
    var STATIC_REVEALS = [
      '.section .split__head .h2',
      '.section .split__head .section-sub',
      '#journey-text',
      '.toolbox .h2',
      '.toolbox__sub',
      '.connect__logo',
      '.connect .h2',
      '.connect__sub',
      '.connect > .btn-dark'
    ].join(',');

    // listas que entram em cascata (os filhos sao gerados pelos renderers)
    var REVEAL_GROUPS = ['#projects-grid', '#work-list', '#edu-list', '#skills-list', '#toolbox-grid'];

    function observeReveals() {
      if (!revealObserver) return;
      REVEAL_GROUPS.forEach(function (sel) {
        var group = document.querySelector(sel);
        if (!group) return;
        Array.prototype.forEach.call(group.children, function (child, i) {
          if (child.classList.contains('reveal')) return;
          child.classList.add('reveal');
          child.style.setProperty('--reveal-delay', Math.min(i, 6) * 60 + 'ms');
        });
      });
      document.querySelectorAll(STATIC_REVEALS).forEach(function (el) {
        if (!el.classList.contains('in')) el.classList.add('reveal');
      });
      document.querySelectorAll('.reveal:not(.in)').forEach(function (el) {
        revealObserver.observe(el);
      });
    }

    // rede de seguranca: num scroll muito rapido o observer pode nao chegar a
    // disparar pra um elemento, entao varremos o que ja entrou na viewport
    function sweepReveals() {
      if (!revealObserver) return;
      var limit = window.innerHeight * 0.92;
      document.querySelectorAll('.reveal:not(.in)').forEach(function (el) {
        if (el.getBoundingClientRect().top < limit) {
          el.classList.add('in');
          revealObserver.unobserve(el);
        }
      });
    }

    // destaca no menu a secao em que o leitor esta
    (function initScrollSpy() {
      var links = Array.prototype.slice.call(
        document.querySelectorAll('.nav__links a[href^="#"], .nav__panel a[href^="#"]')
      );
      if (!links.length) return;

      // so as secoes que existem no menu; as demais (formacao, toolbox)
      // ficam absorvidas pela anterior em vez de apagar o destaque
      var ids = [];
      links.forEach(function (a) {
        var id = a.getAttribute('href').slice(1);
        if (id && ids.indexOf(id) === -1 && document.getElementById(id)) ids.push(id);
      });
      if (!ids.length) return;

      var ticking = false;

      function update() {
        ticking = false;
        sweepReveals();
        var line = window.scrollY + window.innerHeight * 0.35;
        var atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
        var current = '';

        if (atBottom) {
          current = ids[ids.length - 1];
        } else {
          for (var i = 0; i < ids.length; i++) {
            var top = document.getElementById(ids[i]).getBoundingClientRect().top + window.scrollY;
            if (top <= line) current = ids[i];
          }
        }

        links.forEach(function (a) {
          a.classList.toggle('active', a.getAttribute('href') === '#' + current);
        });
      }

      window.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(update);
      }, { passive: true });
      window.addEventListener('resize', update);
      update();
    })();

    // ============================
    // INIT
    // ============================
    function renderAll() {
      renderUiStrings();
      renderJourney();
      renderTabs();
      renderProjects();
      renderWork();
      renderEducation();
      renderSkills();
      renderToolbox();
      observeReveals();
    }
    renderAll();
  })();
  </script>
</body>
</html>
